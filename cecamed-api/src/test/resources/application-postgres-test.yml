# Solo está en el classpath de pruebas; nunca usa las credenciales DB_* reales.
spring:
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

cecamed:
  security:
    jwt:
      secret: ${JWT_SECRET:test-secret-key-for-cecamed-postgres-testing-purposes-at-least-256-bits!}

