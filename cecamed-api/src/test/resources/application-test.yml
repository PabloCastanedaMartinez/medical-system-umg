spring:
  datasource:
    url: jdbc:h2:mem:cecamed_backend;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS cecamed
    username: sa
    password: test-only
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: PUBLIC
  flyway:
    enabled: false

cecamed:
  api-docs-public: true
  cors:
    allowed-origins:
      - http://localhost:5173
  security:
    jwt:
      secret: test-secret-key-for-cecamed-testing-purposes-must-be-at-least-256-bits-long!
      access-token-expiration-minutes: 15
      refresh-token-expiration-days: 7
    brute-force:
      max-attempts: 5
      lockout-duration-minutes: 15
    bootstrap-admin:
      username: ""
      password: ""

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
