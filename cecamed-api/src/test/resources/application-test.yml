spring:
  datasource:
    url: jdbc:h2:mem:cecamed_backend;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: test-only
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        default_schema: PUBLIC
  flyway:
    enabled: false

cecamed:
  api-docs-public: true
  cors:
    allowed-origins:
      - http://localhost:5173

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
