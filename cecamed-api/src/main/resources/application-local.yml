spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:cecamed_backend}}
    username: ${DB_USERNAME:cecamed_backend}

cecamed:
  api-docs-public: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:local-secret-key-for-cecamed-development-only-must-be-at-least-256-bits!}


springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
