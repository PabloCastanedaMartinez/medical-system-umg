spring:
  application:
    name: cecamed-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # También fija UTC para SQL directo y valores DEFAULT de PostgreSQL.
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: cecamed
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: cecamed
    schemas: cecamed
    create-schemas: true
    validate-on-migrate: true
    validate-migration-naming: true
    baseline-on-migrate: false
    clean-disabled: true
  sql:
    init:
      mode: never
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  paths-to-match: /api/v1/**
