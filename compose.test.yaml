name: cecamed-database-tests

services:
  postgres:
    image: postgres:16
    # Zona distinta a UTC para verificar que la conexión de la aplicación la corrige.
    command: ["postgres", "-c", "timezone=America/Guatemala"]
    environment:
      POSTGRES_DB: cecamed_test
      POSTGRES_USER: cecamed_test
      POSTGRES_PASSWORD: test-only
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cecamed_test -d cecamed_test"]
      interval: 2s
      timeout: 5s
      retries: 15
